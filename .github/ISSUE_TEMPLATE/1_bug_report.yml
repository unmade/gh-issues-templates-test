name: Bug report
description: Report unexpected behaviour in an Acme Python support module.
title: "acme-<module>: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to help improve these modules!

        For general support or usage questions, use [#sys-python-guild](https://example.com) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened, what you expected to happen, and the impact of the problem.
      value: |
        ## What happened?

        <!-- Describe the unexpected behaviour and the impact it has. -->

        ## What did you expect to happen?

        <!-- Describe the intended behaviour. -->
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the affected package and version, Python version, and any other relevant dependency or platform details.
      placeholder: |
        Package and version: acme-…
        Python version: 3.…
        Platform: …
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Give the smallest complete example, including relevant configuration and logs.
      placeholder: |
        1. Install …
        2. Run …
        3. Observe …
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed sensitive information from this report.
          required: true
