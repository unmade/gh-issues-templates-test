name: Feature request
description: Suggest an improvement to an Acme Python support module.
title: "acme-<module>: "
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement!

        For general questions, large RFCs, or fundamental proposals, start a discussion in [#sys-python-guild](https://example.com).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem or use case and what you would like to happen.
      value: |
        ## What problem would this solve?

        <!-- Describe the use case and who it affects. -->

        ## What would you like to happen?

        <!-- Describe the desired outcome. An implementation sketch is welcome but not required. -->
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What alternatives have you considered?
      description: Include current workarounds, if any.
  - type: dropdown
    id: contribution
    attributes:
      label: Would you be interested in contributing this?
      options:
        - "Yes, I can contribute an implementation."
        - "Yes, with guidance."
        - "No, but I can help clarify the use case."
        - "No."
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
